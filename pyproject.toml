[project]
name = "modular-agents"
version = "0.1.0"
description = "Build AI agents from small, swappable parts: a model, tools, a loop, a budget, events and a context policy, composed into agents that can use other agents as tools."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Adam Sawicki", email = "adamsawicki89@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]
keywords = ["agents", "llm", "ai", "anthropic", "claude", "composition", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/frycz/modular-agents"
Repository = "https://github.com/frycz/modular-agents"
Issues = "https://github.com/frycz/modular-agents/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
docs = [
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.29",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
